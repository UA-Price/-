<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#2d6a5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="記帳本">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>我的記帳本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ee; --card:#fff; --ink:#1e2226; --muted:#6c7178; --line:#e5e1d8; --soft:#efece5;
  --accent:#2d6a5a; --accent-soft:#e3efe9; --warn:#a86a12; --warn-soft:#fbf1df;
  --danger:#c23b2a; --danger-soft:#fbe7e3; --pos:#2a7a4b; --neg:#c23b2a;
  --r:14px; --shadow:0 1px 2px rgba(0,0,0,.04),0 2px 10px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.5}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;min-height:100vh}
#side{width:220px;flex:none;padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:#faf8f4}
.brand{font-weight:700;font-size:18px;padding:0 10px 18px;display:flex;gap:8px;align-items:center}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:inline-block;position:relative}
.brand i:after{content:"";position:absolute;inset:7px;border:2px solid #fff;border-radius:50%}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--ink);text-decoration:none;margin-bottom:2px}
.nav a:hover{background:var(--soft)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav .badge{margin-left:auto}
.store{margin:18px 10px 0;font-size:12px;color:var(--muted)}
#main{flex:1;min-width:0;padding:26px 30px 120px;max-width:1180px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 12px}
h3{font-size:14px;margin:0 0 8px;color:var(--muted);font-weight:500}
.sub{color:var(--muted);font-size:13px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-size:20px;font-weight:700}
.hero{background:var(--accent);color:#fff;border:none}
.hero .k{color:rgba(255,255,255,.8)}
.hero .v{font-size:30px}
.hero .sub{color:rgba(255,255,255,.8)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer;min-height:38px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.dng{color:var(--danger);border-color:#efc9c2}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.lnk{background:none;border:none;color:var(--accent);cursor:pointer;padding:2px 4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--soft);cursor:pointer}
.list .it:last-child{border-bottom:none}
.list .it:hover{background:#fbfaf7}
.it .t{flex:1;min-width:0}
.it .t b{font-weight:500}
.it .t .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .a{font-weight:700;text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.g{background:var(--accent-soft);color:var(--accent)}
.tag.w{background:var(--warn-soft);color:var(--warn)}
.tag.r{background:var(--danger-soft);color:var(--danger)}
.daygrp{font-size:12.5px;color:var(--muted);padding:12px 2px 2px;display:flex;justify-content:space-between}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.w>i{background:var(--warn)} .bar.r>i{background:var(--danger)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;margin-bottom:8px;font-size:14px;cursor:pointer}
.alert.w{background:var(--warn-soft);color:#6f470b}
.alert.r{background:var(--danger-soft);color:#8a2618}
.alert.g{background:var(--accent-soft);color:#1f4c40}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 6px;border-bottom:1px solid var(--soft);text-align:left;font-size:14px}
th{font-weight:500;color:var(--muted);font-size:12.5px}
td.r,th.r{text-align:right}
.tblwrap{overflow-x:auto}
label.f,div.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;min-height:42px}
.in:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
textarea.in{min-height:70px}
.chk{display:flex;gap:8px;align-items:center;margin-bottom:10px;cursor:pointer}
.chk input{width:18px;height:18px}
.seg{display:flex;background:var(--soft);border-radius:11px;padding:3px;gap:2px;margin-bottom:14px;flex-wrap:wrap}
.seg button{flex:1;border:none;background:none;padding:7px 8px;border-radius:9px;cursor:pointer;min-width:58px}
.seg button.on{background:#fff;box-shadow:var(--shadow);font-weight:700;color:var(--accent)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{display:inline-flex;gap:4px;align-items:center;background:var(--soft);border-radius:99px;padding:3px 6px 3px 11px;font-size:13.5px}
.qcats{display:flex;flex-wrap:wrap;gap:6px}
.qc{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;cursor:pointer;font-size:14px;min-height:36px}
.qc.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.qc.tg{font-size:13px;padding:5px 11px;min-height:32px}
.fxrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fxrow:last-of-type{border-bottom:0}
.fxrow .fxname{flex:1;min-width:140px}
.fxrow .fxin{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.fxrow .fxin label{display:flex;flex-direction:column;gap:2px;flex:1;min-width:110px}
.fxrow.auto{opacity:.55}
.yrbars{display:flex;gap:3px;align-items:flex-end;overflow-x:auto;padding-bottom:4px}
.yb{flex:1;min-width:0;text-align:center;cursor:pointer}
.yb.fut{opacity:.35}
.ybv{height:150px;display:flex;align-items:flex-end;justify-content:center;gap:2px;border-bottom:1px solid var(--line)}
.ybv i{display:block;padding:0;border:0;width:40%;max-width:16px;border-radius:4px 4px 0 0;min-height:1px}
.ybv i.bi{background:var(--pos);opacity:.55}
.ybv i.be{background:var(--accent)}
.ybl{font-size:12px;margin-top:4px}
.ybn{font-size:10px;white-space:nowrap;color:var(--muted)}
i.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 3px 0 6px;vertical-align:-1px}
.calchint{font-size:12px;color:var(--accent);margin-top:2px;font-variant-numeric:tabular-nums}
.calchint.bad{color:var(--danger)}
.fxset{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.fxset label{display:flex;flex-direction:column;gap:2px}
.fxrow.done .fxname b{font-weight:500}
@media (min-width:821px){ .fxrow .fxin{width:auto;flex:2} }
.mbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mbtile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card,#fff);cursor:pointer;text-align:left;font:inherit;color:inherit;min-height:64px}
.mbtile:hover{border-color:var(--accent)}
.qc.tg.on{background:var(--warn);border-color:var(--warn)}
.chip button{border:none;background:none;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0 4px}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px}
/* meals */
.meal{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:#fff}
.meal .mh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.meal .mh b{font-size:15.5px}
.meal .e{display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px dashed var(--soft);cursor:pointer}
.qadd{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr auto;gap:6px;margin-top:8px}
.qadd .in{min-height:40px;padding:7px 9px}
/* modal */
#modalRoot .ov{position:fixed;inset:0;background:rgba(20,22,25,.38);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.md{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:92vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.md.wide{max-width:720px}
.md .mhd{display:flex;align-items:center;padding:16px 18px 6px;position:sticky;top:0;background:#fff;z-index:1}
.md .mhd b{font-size:17px;flex:1}
.md .mbd{padding:8px 18px 4px}
.md .mft{display:flex;gap:8px;padding:12px 18px 18px;position:sticky;bottom:0;background:#fff;border-top:1px solid var(--soft)}
.x{border:none;background:none;font-size:22px;cursor:pointer;color:var(--muted);width:36px;height:36px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#22272b;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.2);max-width:90vw}
#toast div.err{background:var(--danger)}
#toast div.warn{background:#8a5a0f}
body.ro #fab,body.ro [data-act=newTx],body.ro [data-act=newTxType],body.ro .qadd,body.ro [data-act=mealNone],body.ro .md [data-save],body.ro .md [data-del],body.ro [data-act^=new],body.ro [data-act=chipAdd],body.ro [data-act=chipDel],body.ro [data-act=slotAdd],body.ro [data-act=slotDel]{display:none!important}
#fab{position:fixed;right:26px;bottom:26px;width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:30px;box-shadow:0 6px 20px rgba(45,106,90,.4);cursor:pointer;z-index:30}
#bottom{display:none}
.mtop{display:none}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs a{padding:6px 16px;border-radius:99px;background:var(--soft);color:var(--muted);text-decoration:none;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.tabs a.on{background:var(--accent);color:#fff;font-weight:500}
.tabs a.on .tag{background:rgba(255,255,255,.25);color:#fff}
.more-sheet a{display:block;padding:14px 4px;border-bottom:1px solid var(--soft);color:var(--ink);text-decoration:none;font-size:16px}
.banner{background:var(--warn-soft);color:#6f470b;border-radius:10px;padding:9px 12px;font-size:13.5px;margin-bottom:14px}
.welcome{max-width:560px;margin:8vh auto;text-align:center}
.welcome .card{text-align:left}
.stickybar{position:sticky;bottom:12px;z-index:5}
@media (max-width:820px){ .stickybar{bottom:calc(env(safe-area-inset-bottom) + 72px)}
  #side{display:none}
  #main{padding:16px 14px 150px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2{grid-template-columns:1fr}
  .hide-m{display:none}
  #bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
  #bottom a{flex:1;text-align:center;padding:9px 0 10px;font-size:12px;color:var(--muted);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:2px}
  #bottom a .ic{font-size:19px;line-height:1.1}
  #bottom a.on{color:var(--accent);font-weight:700}
  #bottom .dot{position:absolute;top:-4px;right:-12px;background:var(--danger);color:#fff;font-style:normal;font-size:10px;line-height:15px;min-width:15px;padding:0 4px;border-radius:99px;font-weight:700}
  #fab{bottom:76px;right:16px}
  .mtop{display:flex;align-items:center;margin:-4px 0 12px;font-size:16px}
  .mtop a{color:var(--muted);text-decoration:none;font-size:14px;padding:6px 10px;border-radius:99px;background:var(--soft)}
  .mtop a.on{background:var(--accent);color:#fff}
  .qadd{grid-template-columns:1fr 1fr}
  .qadd .btn{grid-column:span 2}
  .md{max-height:94vh}
  #modalRoot .ov{align-items:flex-end;padding:0}
  .md{border-radius:16px 16px 0 0}
}
@media (max-width:420px){ .fr{grid-template-columns:1fr} .stat .v{font-size:18px} }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><i></i>我的記帳本</div>
    <nav class="nav" id="nav"></nav>
    <div class="store" id="storeNote"></div>
  </aside>
  <main id="main"><div class="empty">資料載入中…</div></main>
</div>
<nav id="bottom"></nav>
<button id="fab" data-act="newTx" title="記一筆" aria-label="記一筆">＋</button>
<div id="modalRoot"></div>
<div id="toast"></div>

<script>
'use strict';
/* =========================================================
   基本設定與工具
   ========================================================= */
const COLS = ['config','tx','shared','settle','alloc','recon','benefit','mealday','wish','hist'];
const S = {}; COLS.forEach(c => S[c] = {});
let MODE = 'loading', DB = null, DL = null, CACHE = null, LOAD_SLOW = false, RO = false;
const LOADED = new Set();
const LS_KEY = 'finance-book-v1';

const ACC_TYPES = {bank:'銀行', cash:'現金', epay:'電子支付', credit:'信用卡'};
const TX_TYPES  = {expense:'支出', income:'收入', transfer:'轉帳', ccpay:'繳卡費', refund:'退款', adjust:'盤點調整'};
const FUND_KINDS = ['緊急預備金','固定支出預留','儲蓄目標','其他'];
const NW = {need:'需要', want:'想要', both:'兩者都有'};
const NW_CLS = {need:'g', want:'w', both:''};
const nwSeg = (cur, attr='data-nw') => `<div class="seg" style="margin-bottom:12px">${Object.entries(NW).map(([k, v]) => `<button type="button" ${attr}="${k}" class="${cur === k ? 'on' : ''}">${v}</button>`).join('')}</div>`;
const nwDefault = catId => { const c = cat(catId); return c ? (c.essential ? 'need' : 'want') : ''; };
const PAGES = [
  ['overview','總覽','◎'], ['ledger','記帳明細','✎'], ['meals','記一筆','◐'], ['money','資金管理','▣'],
  ['budget','預算與儲蓄','◔'], ['shared','共同消費／代購','⇄'], ['benefits','優惠與點數','✦'], ['wishlist','等待購買','☆'], ['recurring','固定收支','↻'], ['analysis','消費分析','▤'], ['review','月底回顧','◑'], ['yearly','年度總覽','▥'], ['config','系統設定','⚙']
];

const GROUPS = [
  ['overview','總覽','◎',[['overview','總覽']]],
  ['ledger','記帳','✎',[['meals','記一筆'],['ledger','明細']]],
  ['money','錢包','▣',[['money','帳戶與存錢'],['recurring','固定收支'],['shared','往來款項']]],
  ['analysis','分析','▤',[['analysis','消費分析'],['review','月底回顧'],['yearly','年度總覽'],['budget','預算']]],
  ['benefits','優惠與點數','✦',[['benefits','優惠與點數']],'優惠'],
  ['wishlist','等待購買','☆',[['wishlist','等待購買']],'想買'],
];
const groupOf = p => GROUPS.find(g => g[3].some(t => t[0] === p));
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const ymOf = s => String(s || '').slice(0, 7);
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d||1); };
const addMonth = (ym, n) => { const [y,m] = ym.split('-').map(Number); const d = new Date(y, m-1+n, 1); return d.getFullYear() + '-' + pad(d.getMonth()+1); };
const daysIn = (y, m) => new Date(y, m+1, 0).getDate();
const dateWithDay = (y, m, day) => { const d = new Date(y, m, 1); return new Date(d.getFullYear(), d.getMonth(), Math.min(day, daysIn(d.getFullYear(), d.getMonth()))); };
const dayDiff = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000); // b - a
const r2 = n => Math.round((+n || 0) * 100) / 100;
const money = (n, sign=false) => { n = Math.round(+n || 0); const s = Math.abs(n).toLocaleString('zh-TW'); return (n < 0 ? '-' : (sign && n > 0 ? '+' : '')) + '$' + s; };
const amt = (n, cur='TWD') => cur === 'TWD' ? money(n) : (Math.round(n*100)/100).toLocaleString('zh-TW') + ' ' + cur;
const ymLabel = ym => { const [y,m] = ym.split('-'); return y + ' 年 ' + Number(m) + ' 月'; };
const mdLabel = s => { const d = parseD(s); return (d.getMonth()+1) + '/' + d.getDate() + '（' + '日一二三四五六'[d.getDay()] + '）'; };
function weekStart(s){ const d = parseD(s); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return ymd(d); }

const UI = {
  month: ymOf(today()), mealDate: today(), q:'', fType:'', fAcc:'', fCat:'', fNw:'',
  fTag:'', anTag:'', sharedPerson:'', benefitHist:false, budgetMonth: ymOf(today()), anMonth: ymOf(today()), showInactive:false
};
try { const v = JSON.parse(localStorage.getItem('fb-ui') || '{}'); if (v.lastAcc) UI.lastAcc = v.lastAcc; } catch(e) {}
function rememberAcc(id){ UI.lastAcc = id; try { localStorage.setItem('fb-ui', JSON.stringify({lastAcc:id})); } catch(e) {} }

/* =========================================================
   資料儲存（雲端資料庫，無法使用時改存本機瀏覽器）
   ========================================================= */
const QUEUE = {};
function enqueue(key, fn){ const p = (QUEUE[key] || Promise.resolve()).catch(()=>{}).then(fn); QUEUE[key] = p; return p; }
async function withRetry(fn){
  try { return await fn(); }
  catch(e){ if (e && e.code === 'unavailable'){ await new Promise(r => setTimeout(r, 600 + Math.random()*800)); return fn(); } throw e; }
}
let MM_REDRAW = null;
function dirty(){ CACHE = null; scheduleRender(); if (MM_REDRAW) setTimeout(() => MM_REDRAW && MM_REDRAW(), 0); }
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e) { toast('本機儲存失敗：' + e.message, 'err'); } }
function loadLocal(){ try { const d = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); COLS.forEach(c => S[c] = d[c] || {}); } catch(e) {} }

function roBlock(){ if (!RO) return false; toast('這是檢視模式，只有記帳本的主人可以新增或修改', 'warn'); return true; }
async function put(col, id, data){
  if (roBlock()) return;
  const body = JSON.parse(JSON.stringify({...data, id, updatedAt: Date.now()}));
  S[col][id] = body; dirty();
  if (GAS) return gQueue({op:'put', col, id, json:JSON.stringify(body)});
  if (MODE === 'cloud') return enqueue(col + '/' + id, () => withRetry(() => DB.collection(col).doc(id).set(body)));
  saveLocal();
}
async function del(col, id){
  if (roBlock()) return;
  delete S[col][id]; dirty();
  if (GAS) return gQueue({op:'del', col, id});
  if (MODE === 'cloud') return enqueue(col + '/' + id, () => withRetry(() => DB.collection(col).doc(id).delete()));
  saveLocal();
}
function errMsg(e){
  if (!e) return '未知錯誤';
  if (e.code === 'quota_exceeded') return '資料庫容量已滿，請先刪除舊資料';
  if (e.code === 'invalid_argument') return '沒有寫入權限或資料格式錯誤';
  if (e.code === 'revoked') return '存取權已變更，請重新整理';
  return e.message || e.code || String(e);
}

/* ---------- Google Apps Script（Google 試算表）儲存層 ---------- */
const CFG = window.APP_CONFIG || null;
const SHEETS = !!(CFG && CFG.clientId && CFG.sheetId && !/貼上/.test(CFG.clientId + CFG.sheetId));
const GAS = SHEETS;
/* ---------- Google 試算表 API（GitHub Pages 版） ---------- */
const SH = {token:'', exp:0, gid:null, tc:null, needLogin:false, email:''};
const needLoginErr = () => { const e = new Error('需要重新登入 Google'); e.code = 'NEED_LOGIN'; return e; };
function shGetToken(){
  return new Promise((res, rej) => {
    if (!(window.google && google.accounts && google.accounts.oauth2)) return rej(new Error('Google 登入元件還在載入，請再按一次'));
    if (!SH.tc) SH.tc = google.accounts.oauth2.initTokenClient({client_id:CFG.clientId, scope:'https://www.googleapis.com/auth/spreadsheets', callback:() => {}});
    SH.tc.callback = r => { if (r.error) return rej(new Error(r.error_description || r.error)); SH.token = r.access_token; SH.exp = Date.now() + ((+r.expires_in || 3600) - 120) * 1000; SH.needLogin = false; res(); };
    SH.tc.error_callback = e => rej(new Error(e && e.type === 'popup_closed' ? '登入視窗被關閉了' : '登入失敗，請允許彈出視窗後再試'));
    SH.tc.requestAccessToken({prompt:''});
  });
}
function shErr(status, text){
  if (status === 403) return '沒有這份試算表的權限（請確認試算表已共用給這個 Google 帳號）';
  if (status === 404) return '找不到試算表，請確認 config.js 裡的 sheetId';
  if (status === 429) return 'Google 暫時限制使用次數，請稍後再試';
  try { return JSON.parse(text).error.message; } catch(e){ return '連線錯誤（' + status + '）'; }
}
async function shFetch(path, opt = {}, retry = true){
  if (!SH.token || Date.now() > SH.exp){ SH.needLogin = true; dirty(); throw needLoginErr(); }
  const r = await fetch('https://sheets.googleapis.com/v4/spreadsheets/' + encodeURIComponent(CFG.sheetId) + path, {...opt, headers:{'Authorization':'Bearer ' + SH.token, 'Content-Type':'application/json'}});
  if (r.status === 401){ SH.token = ''; SH.needLogin = true; dirty(); throw needLoginErr(); }
  if (!r.ok){ const e = new Error(shErr(r.status, await r.text())); e.status = r.status; throw e; }
  return r.json();
}
async function shEnsure(){
  if (SH.gid !== null) return;
  const meta = await shFetch('?fields=sheets.properties');
  const sh = (meta.sheets || []).find(x => x.properties.title === 'data');
  if (sh){ SH.gid = sh.properties.sheetId; return; }
  const r = await shFetch(':batchUpdate', {method:'POST', body:JSON.stringify({requests:[{addSheet:{properties:{title:'data'}}}]})});
  SH.gid = r.replies[0].addSheet.properties.sheetId;
  await shFetch('/values/data!A1:D1?valueInputOption=RAW', {method:'PUT', body:JSON.stringify({values:[['key','collection','json','updatedAt']]})});
}
const SHEET_API = {
  async loadAll(){
    await shEnsure();
    const v = await shFetch('/values/data!A2:C?majorDimension=ROWS');
    const data = {};
    for (const r of (v.values || [])){
      const key = String(r[0] || ''); const i = key.indexOf('/'); if (i < 0 || !r[2]) continue;
      try { (data[key.slice(0, i)] = data[key.slice(0, i)] || {})[key.slice(i + 1)] = JSON.parse(r[2]); } catch(e){}
    }
    let canEdit = true;
    try { await shFetch('/values/data!F1?valueInputOption=RAW', {method:'PUT', body:JSON.stringify({values:[['最後開啟：' + new Date().toLocaleString('zh-TW')]]})}); }
    catch(e){ if (e.status === 403) canEdit = false; else throw e; }
    return {data, canEdit};
  },
  async saveBatch(ops){
    await shEnsure();
    const ka = await shFetch('/values/data!A2:A?majorDimension=ROWS');
    const keys = (ka.values || []).map(r => String(r[0] || ''));
    const rowOf = {}; keys.forEach((k, i) => { if (k) rowOf[k] = i + 2; });
    const fin = new Map(); ops.forEach(o => { const k = o.col + '/' + o.id; fin.delete(k); fin.set(k, o); });
    let next = keys.length + 2; const now = new Date().toISOString(); const data = []; const delRows = [];
    for (const [k, o] of fin){
      if (o.op === 'put'){
        if (String(o.json).length > 49000) throw new Error('單筆資料太大（' + k + '）');
        const row = rowOf[k] || next++;
        data.push({range:`data!A${row}:D${row}`, values:[[k, o.col, o.json, now]]});
      } else if (rowOf[k]) delRows.push(rowOf[k]);
    }
    if (data.length) await shFetch('/values:batchUpdate', {method:'POST', body:JSON.stringify({valueInputOption:'RAW', data})});
    if (delRows.length) await shFetch(':batchUpdate', {method:'POST', body:JSON.stringify({requests:delRows.sort((a, b) => b - a).map(r => ({deleteDimension:{range:{sheetId:SH.gid, dimension:'ROWS', startIndex:r - 1, endIndex:r}}}))})});
    return true;
  }
};
const gas = (fn, ...args) => SHEET_API[fn](...args);
// 快到期時，趁使用者點畫面時順便續期（Google 會閃一下小視窗）
document.addEventListener('click', () => {
  if (!SHEETS || !SH.token || SH.renewing || SH.exp - Date.now() > 10 * 60 * 1000) return;
  SH.renewing = true; shGetToken().catch(() => {}).finally(() => { SH.renewing = false; });
}, true);
let GOPS = [], GTIMER = null, GBUSY = null, GWAIT = [];
function gQueue(op){ GOPS.push(op); clearTimeout(GTIMER); GTIMER = setTimeout(gFlush, 250); return new Promise(r => GWAIT.push(r)); }
async function gFlush(){
  if (GBUSY){ await GBUSY; }
  if (!GOPS.length) return;
  const ops = GOPS; GOPS = []; const waits = GWAIT; GWAIT = [];
  GBUSY = (async () => {
    try { await gas('saveBatch', ops); }
    catch(e){
      if (e && e.code === 'NEED_LOGIN'){ GOPS = ops.concat(GOPS); toast('登入已過期，請按上方「重新登入」，剛才的資料會在登入後存進去', 'warn'); return; }
      toast('儲存失敗：' + (e && e.message || e) + '，已重新載入資料', 'err'); await gLoad().catch(() => {});
    }
    finally { waits.forEach(r => r()); GBUSY = null; if (GOPS.length && !SH.needLogin) gFlush(); }
  })();
  return GBUSY;
}
async function gLoad(){
  const r = await gas('loadAll');
  COLS.forEach(c => { S[c] = (r.data && r.data[c]) || {}; LOADED.add(c); });
  RO = !r.canEdit; document.body.classList.toggle('ro', RO); dirty();
}
async function initStore(){
  if (!SHEETS){ MODE = 'setup'; dirty(); return; }
  if (GAS){
    MODE = 'cloud'; SH.needLogin = true; dirty();
    const poll = () => { if (document.visibilityState === 'visible' && SH.token && !SH.needLogin && !GOPS.length && !GBUSY && !MODAL_STACK.length) gLoad().catch(() => {}); };
    setInterval(poll, 60000); document.addEventListener('visibilitychange', poll);
    return;
  }
  let cl = null;
  for (let i = 0; i < 30 && !(window.claude && window.claude.use); i++) await new Promise(r => setTimeout(r, 100));
  if (window.claude && window.claude.use){
    try { cl = await Promise.race([window.claude.use('db'), new Promise(r => setTimeout(() => r(null), 10000))]); } catch(e) { cl = null; }
    try { DL = await Promise.race([window.claude.use('downloads'), new Promise(r => setTimeout(() => r(null), 4000))]); } catch(e) { DL = null; }
    try { const u = await Promise.race([window.claude.use('user'), new Promise(r => setTimeout(() => r(null), 4000))]); if (u && cl) RO = !u.isOwner(); } catch(e) {}
    document.body.classList.toggle('ro', RO);
  }
  if (cl){
    DB = cl; MODE = 'cloud';
    const timer = setTimeout(() => { LOAD_SLOW = true; render(); }, 10000);
    COLS.forEach(col => {
      DB.collection(col).onSnapshot(snap => {
        const m = {}; snap.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); });
        S[col] = m;
        if (!snap.metadata.fromCache) LOADED.add(col);
        if (LOADED.size === COLS.length){ clearTimeout(timer); LOAD_SLOW = false; }
        dirty();
      }, err => { LOADED.add(col); toast('資料同步中斷：' + errMsg(err), 'err'); dirty(); });
    });
  } else {
    MODE = 'local'; loadLocal(); COLS.forEach(c => LOADED.add(c)); dirty();
  }
}

/* =========================================================
   帳務計算核心
   ========================================================= */
function compute(){
  const A = {};
  C.accounts.forEach(a => A[a.id] = {...a, bal: +a.initBalance || 0});
  const flows = [];       // {acc, amt, date}
  const items = [];       // 收支分析用：{date, kind, twd, categoryId, meal, scene, src, ref}
  const addF = (id, v, date) => { if (!id) return; if (A[id]) A[id].bal = r2(A[id].bal + v); flows.push({acc:id, amt:v, date}); };
  for (const t of Object.values(S.tx)){
    const a = +t.amount || 0; const twd = t.twd != null ? +t.twd : a * (+t.rate || 1);
    const base = {date:t.date, categoryId:t.categoryId, meal:t.meal || '', scene:t.scene || '', nw:t.nw || '', src:'tx', ref:t.id, tags:t.tags || []};
    if (t.type === 'income'){ addF(t.accountId, a, t.date); items.push({...base, kind:'income', twd}); }
    else if (t.type === 'expense'){ addF(t.accountId, -a, t.date); items.push({...base, kind:'expense', twd}); }
    else if (t.type === 'refund'){ addF(t.accountId, a, t.date); items.push({...base, kind:'expense', twd:-twd}); }
    else if (t.type === 'transfer' || t.type === 'ccpay'){ addF(t.accountId, -a, t.date); addF(t.toAccountId, t.toAmount != null && t.toAmount !== '' ? +t.toAmount : a, t.date); }
    else if (t.type === 'adjust'){ addF(t.accountId, a, t.date); }
  }
  for (const h of Object.values(S.hist)) for (const it of (h.income || [])) items.push({date:h.month + '-01', kind:'income', twd:+it.amount || 0, n:1, categoryId:it.categoryId, meal:'', scene:'', nw:'', src:'hist', ref:h.id});
  for (const h of Object.values(S.hist)) (h.rows || []).forEach((r, k) => items.push({date:r.date, kind:'expense', twd:+r.amount || 0, categoryId:r.categoryId, meal:mealFor(r.categoryId), scene:r.scene || '', nw:r.nw || '', src:'histrow', ref:h.id, k, tags:r.tags || []}));
  for (const h of Object.values(S.hist)) if (!(h.rows || []).length) for (const it of (h.items || [])) items.push({date:h.month + '-01', kind:'expense', twd:+it.amount || 0, n:+it.count || 0, categoryId:it.categoryId, meal:it.meal || '', scene:'', nw:'', src:'hist', ref:h.id});
  const allocBy = {}, allocBySettle = {};
  for (const al of Object.values(S.alloc)){
    allocBy[al.sharedId] = r2((allocBy[al.sharedId] || 0) + (+al.amount || 0));
    allocBySettle[al.settleId] = r2((allocBySettle[al.settleId] || 0) + (+al.amount || 0));
  }
  const recv = {}, sh = {}; // sharedId -> {dir, due, got, left}
  for (const s of Object.values(S.shared)){
    const rate = +s.rate || 1;
    if (s.payer === 'other'){
      items.push({date:s.date, kind:'expense', twd:(+s.myShare || 0) * rate, categoryId:s.categoryId, meal:s.meal || '', scene:s.scene || '', nw:s.nw || '', src:'shared', ref:s.id, tags:s.tags || []});
      const due = r2((+s.myShare || 0) * rate), got = allocBy[s.id] || 0;
      sh[s.id] = {dir:'out', due, got, left: r2(Math.max(0, due - got))};
      continue;
    }
    addF(s.accountId, -(+s.total || 0), s.date);
    items.push({date:s.date, kind:'expense', twd:(+s.myShare || 0) * rate, categoryId:s.categoryId, meal:s.meal || '', scene:s.scene || '', nw:s.nw || '', src:'shared', ref:s.id, tags:s.tags || []});
    const other = r2((+s.otherShare || 0) * rate), got = allocBy[s.id] || 0;
    recv[s.id] = {other, got, left: r2(Math.max(0, other - got))};
    sh[s.id] = {dir:'in', due:other, got, left:recv[s.id].left};
  }
  for (const st of Object.values(S.settle)) addF(st.accountId, (st.direction === 'out' ? -1 : 1) * (+st.amount || 0), st.date);
  const settleLeft = {};
  for (const st of Object.values(S.settle)) settleLeft[st.id] = r2((+st.amount || 0) * (+st.rate || 1) - (allocBySettle[st.id] || 0));

  // 資產與可用資金
  let assets = 0, liab = 0, ccOver = 0;
  for (const a of Object.values(A)){
    a.twd = a.bal * rateOf(a.currency || 'TWD');
    if (a.type === 'credit'){ if (a.twd < 0) liab += -a.twd; else ccOver += a.twd; }
    else assets += a.twd;
  }
  const fundCur = {};
  for (const f of C.funds){
    const cur = Object.values(A).filter(a => a.fundId === f.id && a.type !== 'credit').reduce((s, a) => s + a.twd, 0);
    fundCur[f.id] = cur;
  }
  const reserved = C.funds.filter(f => f.active !== false).reduce((s, f) => s + Math.max(0, fundCur[f.id] || 0), 0);
  const receivable = Object.values(recv).reduce((s, r) => s + r.left, 0);
  const payable = Object.values(sh).filter(r => r.dir === 'out').reduce((s, r) => s + r.left, 0);
  const cards = Object.values(A).filter(a => a.type === 'credit').map(a => ({...a, ...cardInfo(a, flows)}));
  const unpaidUncovered = cards.filter(c => !c.coverFundId).reduce((s, c) => s + c.liabTwd, 0);
  const daily = assets - reserved;
  return {
    A, flows, items, recv, sh, settleLeft, fundCur, cards,
    assets, liab, receivable, payable, ccOver, totalLiab: liab + payable,
    totalAssets: assets + receivable + ccOver, net: assets + receivable + ccOver - liab - payable,
    reserved, daily, conservative: daily - unpaidUncovered - payable,
  };
}
const comp = () => CACHE || (CACHE = compute());

function cardInfo(a, flows){
  const rate = rateOf(a.currency || 'TWD');
  const liab = Math.max(0, -a.bal);
  const out = {liab, liabTwd: liab * rate};
  if (!a.closingDay) return out;
  const t = new Date(); t.setHours(0,0,0,0);
  let close = dateWithDay(t.getFullYear(), t.getMonth(), +a.closingDay);
  if (close > t) close = dateWithDay(t.getFullYear(), t.getMonth() - 1, +a.closingDay);
  const cs = ymd(close);
  let balAt = +a.initBalance || 0, inAfter = 0;
  for (const f of flows){ if (f.acc !== a.id) continue; if (f.date <= cs) balAt += f.amt; else if (f.amt > 0) inAfter += f.amt; }
  const billed = Math.min(liab, Math.max(0, -balAt - inAfter));
  let due = null;
  if (a.dueDay){
    due = +a.dueDay > +a.closingDay ? dateWithDay(close.getFullYear(), close.getMonth(), +a.dueDay) : dateWithDay(close.getFullYear(), close.getMonth() + 1, +a.dueDay);
  }
  return {...out, closeDate: cs, billed: r2(billed), dueDate: due ? ymd(due) : '', dueIn: due ? dayDiff(today(), ymd(due)) : null};
}

function monthStats(month){
  const c = comp(); const st = C.settings;
  const its = c.items.filter(i => ymOf(i.date) === month);
  const inc = its.filter(i => i.kind === 'income'), exp = its.filter(i => i.kind === 'expense');
  const income = inc.reduce((s, i) => s + i.twd, 0), expense = exp.reduce((s, i) => s + i.twd, 0);
  const byRoot = {}, byCat = {}, byInc = {};
  let essential = 0, nonEss = 0;
  for (const i of exp){
    const r = rootCat(i.categoryId); const rk = r ? r.id : '_';
    byRoot[rk] = (byRoot[rk] || 0) + i.twd; byCat[i.categoryId || '_'] = (byCat[i.categoryId || '_'] || 0) + i.twd;
    const cc = cat(i.categoryId); if (cc && cc.essential) essential += i.twd; else nonEss += i.twd;
  }
  for (const i of inc){ const r = rootCat(i.categoryId); const rk = r ? r.id : '_'; byInc[rk] = (byInc[rk] || 0) + i.twd; }
  const count = exp.reduce((x, i) => x + (i.src === 'hist' ? (i.n || 0) : (i.twd > 0 ? 1 : 0)), 0);
  const meals = exp.filter(i => isMealCat(i.categoryId));
  const mealTotal = meals.reduce((s, i) => s + i.twd, 0);
  const bySlot = {}; for (const i of meals){ const k = i.meal || '其他餐飲'; bySlot[k] = (bySlot[k] || 0) + i.twd; }
  const liveMeals = meals.filter(i => i.src !== 'hist'); const histMeal = meals.filter(i => i.src === 'hist').reduce((x, i) => x + i.twd, 0);
  const dailyMeals = liveMeals.filter(i => (i.scene || st.dailyScene) === st.dailyScene);
  const dailyTotal = dailyMeals.reduce((s, i) => s + i.twd, 0);
  const days = new Set(dailyMeals.map(i => i.date));
  for (const md of Object.values(S.mealday)) if (ymOf(md.date) === month && (md.none || []).length) days.add(md.date);
  const byNw = {need:0, want:0, both:0, '':0}; for (const i of exp.filter(i => i.src !== 'hist' && !(i.src === 'histrow' && !i.nw))) byNw[i.nw || ''] = (byNw[i.nw || ''] || 0) + i.twd;
  const wantTop = exp.filter(i => i.nw === 'want' || i.nw === 'both').sort((a, b) => b.twd - a.twd).slice(0, 8);
  const byScene = {}; for (const i of liveMeals){ const k = i.scene || st.dailyScene; byScene[k] = (byScene[k] || 0) + i.twd; }
  return {byNw, wantTop, income, expense, net: income - expense, byRoot, byCat, byInc, essential, nonEss, count, avg: count ? expense / count : 0,
          mealTotal, bySlot, dailyTotal, specialTotal: mealTotal - histMeal - dailyTotal, histMeal, hist:S.hist[month] || null, histTotal:exp.filter(i => i.src === 'hist' || i.src === 'histrow').reduce((x, i) => x + i.twd, 0), histIncome:inc.filter(i => i.src === 'hist').reduce((x, i) => x + i.twd, 0), mealDays: days.size, dailyAvg: days.size ? dailyTotal / days.size : 0, byScene, mealCount: meals.reduce((x, i) => x + (i.src === 'hist' ? (i.n || 0) : (i.twd > 0 ? 1 : 0)), 0)};
}

/* 預算：每個分類的預算金額沿用「最近一次設定」；剩餘金額依分類設定逐月結轉 */
function catActual(catId, month){
  const ids = catDesc(catId);
  return comp().items.filter(i => i.kind === 'expense' && ymOf(i.date) === month && ids.has(i.categoryId)).reduce((s, i) => s + i.twd, 0);
}
function budgetBase(catId, month){
  const list = C.budgets.filter(b => b.categoryId === catId && b.month <= month).sort((a, b) => a.month < b.month ? 1 : -1);
  return list.length ? +list[0].amount || 0 : null;
}
function budgetRow(catId, month){
  const list = C.budgets.filter(b => b.categoryId === catId).map(b => b.month).sort();
  if (!list.length || month < list[0]) return null;
  const c = cat(catId); const carryNeg = C.settings.carryNegative;
  let carry = 0, m = list[0], guard = 0;
  while (guard++ < 600){
    const base = budgetBase(catId, m) || 0; const avail = base + carry; const actual = catActual(catId, m);
    if (m === month) return {base, carry, avail, actual, remain: avail - actual};
    const rem = avail - actual;
    carry = c && c.rollover ? (carryNeg ? rem : Math.max(0, rem)) : 0;
    m = addMonth(m, 1);
  }
  return null;
}
function groupIds(g){ const ids = new Set(); (g.cats || []).forEach(c => catDesc(c).forEach(x => ids.add(x))); return ids; }
function groupActual(g, month){ const ids = groupIds(g); return comp().items.filter(i => i.kind === 'expense' && ymOf(i.date) === month && ids.has(i.categoryId)).reduce((s, i) => s + i.twd, 0); }
function groupBase(g, month){ const h = (g.hist || []).filter(x => x.month <= month).sort((a, b) => a.month < b.month ? 1 : -1); return h.length ? +h[0].amount || 0 : null; }
function groupRow(g, month){
  const ms = (g.hist || []).map(x => x.month).sort(); if (!ms.length || month < ms[0]) return null;
  let carry = 0, m = ms[0], guard = 0;
  while (guard++ < 600){
    const base = groupBase(g, m) || 0; const avail = base + carry; const actual = groupActual(g, m);
    if (m === month) return {base, carry, avail, actual, remain:avail - actual};
    const rem = avail - actual; carry = g.rollover ? (C.settings.carryNegative ? rem : Math.max(0, rem)) : 0; m = addMonth(m, 1);
  }
  return null;
}
function inGroup(catId, month){ return C.bgroups.some(g => groupBase(g, month) !== null && groupIds(g).has(catId)); }
function budgetRows(month){
  const rows = [];
  for (const c of C.categories.filter(c => c.type === 'expense')){
    const r = budgetRow(c.id, month); if (!r) continue;
    let p = c.parentId && cat(c.parentId), nested = false;
    while (p){ if (C.budgets.some(b => b.categoryId === p.id && b.month <= month)) { nested = true; break; } p = p.parentId && cat(p.parentId); }
    if (!nested && inGroup(c.id, month)) nested = true;
    rows.push({cat:c, ...r, nested});
  }
  const out = []; const byAmt = (x, y) => (y.base || 0) - (x.base || 0) || (y.actual || 0) - (x.actual || 0);
  const gl = C.bgroups.map(g => ({g, r:groupRow(g, month)})).filter(x => x.r).sort((x, y) => byAmt(x.r, y.r));
  const blocks = gl.map(({g, r}) => { const ids = groupIds(g); const kids = rows.filter(x => ids.has(x.cat.id)); kids.forEach(x => x._used = true); return {top:{cat:{id:'grp:' + g.id, name:g.name, rollover:g.rollover}, group:g, ...r, nested:false}, kids}; });
  const rest = rows.filter(x => !x._used); const byId = {};
  for (const x of rest) if (!x.nested){ const bk = {top:x, kids:[]}; blocks.push(bk); byId[x.cat.id] = bk; }
  for (const x of rest) if (x.nested){ let p = x.cat.parentId && cat(x.cat.parentId), bk = null; while (p && !bk){ bk = byId[p.id]; p = p.parentId && cat(p.parentId); } if (bk) bk.kids.push(x); else blocks.push({top:x, kids:[]}); }
  blocks.sort((x, y) => byAmt(x.top, y.top)).forEach(bk => out.push(bk.top, ...bk.kids.sort(byAmt)));
  return out;
}

function fundStatus(f){
  const cur = comp().fundCur[f.id] || 0; const target = +f.target || 0;
  const pct = target ? Math.max(0, Math.min(100, cur / target * 100)) : 0;
  let monthly = null;
  if (f.targetDate && target > cur){
    const months = Math.max(1, Math.ceil(dayDiff(today(), f.targetDate) / 30.44));
    monthly = dayDiff(today(), f.targetDate) > 0 ? (target - cur) / months : null;
  }
  return {cur, target, pct, gap: target - cur, below: target > 0 && cur < target, monthly};
}

function benefitState(b){
  const remind = +C.settings.remindDays || 7;
  if (b.status === 'used') return {state:'used', left:null};
  if (!b.expiry) return {state:'active', left:null};
  const left = dayDiff(today(), b.expiry);
  if (left < 0) return {state:'expired', left};
  return {state: left <= remind ? 'soon' : 'active', left};
}

function mealEntries(date){
  const out = [];
  for (const t of Object.values(S.tx)) if (t.type === 'expense' && t.date === date && t.meal) out.push({kind:'tx', id:t.id, meal:t.meal, amount:+t.twd || +t.amount, note:t.note, accountId:t.accountId, scene:t.scene});
  for (const s of Object.values(S.shared)) if (s.date === date && s.meal) out.push({kind:'shared', id:s.id, meal:s.meal, amount:(+s.myShare || 0) * (+s.rate || 1), note:(s.desc || '') + '（共同・本人負擔）', accountId:s.accountId, scene:s.scene});
  return out.sort((a, b) => (S.tx[a.id]?.createdAt || 0) - (S.tx[b.id]?.createdAt || 0));
}

const val = (root, sel) => { const el = root.querySelector(sel); return el ? el.value.trim() : ''; };
function calcVal(v){
  v = String(v == null ? '' : v).replace(/[＋]/g, '+').replace(/[－—]/g, '-').replace(/[×xX＊]/g, '*').replace(/[÷／]/g, '/').replace(/[，,\s]/g, '').replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0) - 65248)).replace(/．/g, '.');
  if (v === '') return NaN; if (/^-?\d*\.?\d+$/.test(v)) return Number(v);
  if (!/^[\d+\-*/.()]+$/.test(v) || !/\d/.test(v)) return NaN;
  try { const r = Function('"use strict";return (' + v + ')')(); return isFinite(r) ? Math.round(r * 100) / 100 : NaN; } catch(e){ return NaN; }
}
const isExpr = v => /[+\-*/×÷＋]/.test(String(v).replace(/^-/, ''));

  let h = el.parentNode.querySelector('.calchint');

  if (!h){ h = document.createElement('div'); h.className = 'calchint'; el.insertAdjacentElement('afterend', h); }
  const r = calcVal(el.value); h.textContent = isNaN(r) ? '算式有誤' : '＝ ' + r.toLocaleString();
  h.classList.toggle('bad', isNaN(r));
}

}
function budgetHint(catId, date){
  if (!catId) return '';
  const rows = budgetRows(ymOf(date || today())).filter(r => !r.nested);
  const r = rows.find(x => x.group ? groupIds(x.group).has(catId) : catDesc(x.cat.id).has(catId));
  if (!r) return '';
  return r.remain >= 0 ? `・${r.cat.name}本月還剩 ${money(r.remain)}` : `・${r.cat.name}已超支 ${money(-r.remain)}`;
}
function budgetToast(base, catId, date){ const h = budgetHint(catId, date); toast(base + h, h.includes('超支') ? 'warn' : ''); }
const fixedBudget = r => !r.group && /房租|水電|電信|居住|訂閱/.test(r.cat.name);
function budgetCard(m){

  const meal = rows.find(r => !r.group && r.cat.isMeal !== undefined && /餐飲/.test(r.cat.name));

    <div class="stat hero"><div class="k">現在可以自由花的錢</div><div class="v num">${money(c.daily)}</div><div class="sub">日常帳戶合計，已扣除旅日、緊急、房租等預留的錢</div></div>

  <div class="card"><div class="row" style="align-items:flex-end"><div><h2 style="margin:0 0 2px">${now.getMonth() + 1} 月花了多少</h2>
      <div class="sub">收入 ${ms.income ? '<b class="pos num">' + money(ms.income) + '</b>' : '尚未記錄'}・平均每天 ${money(ms.expense / dayNo)}・餐飲 ${ms.mealCount} 筆、其他 ${ms.count - ms.mealCount} 筆${ms.hist ? `・含匯入的歷史彙總 ${money(ms.histTotal)}` : ''}</div></div>

    <div class="list" style="margin-top:8px">${list.length ? list.map(catRow).join('') : '<div class="empty">這個月還沒有支出紀錄</div>'}</div>
    <div class="row" style="margin-top:6px"><span class="sub">點任一項目可看該分類的紀錄。有設預算的項目會顯示剩餘額度。</span><span class="sp"></span><button class="lnk" data-go="analysis">更多分析 →</button></div>
  </div>

  ${alerts.length ? `<div class="card"><h2>提醒</h2>${alerts.map(([t, msg, go]) => `<div class="alert ${t}" data-go="${go}">${msg}</div>`).join('')}</div>` : ''}

  <div class="grid g2">
    <div class="card" style="margin:0"><h2>存錢目標</h2>
      ${funds.length ? funds.map(f => fundLine(f)).join('') : '<div class="sub">尚未建立資金用途，可到「資金管理」新增。</div>'}</div>
    <div class="card" style="margin:0"><h2>信用卡</h2>${cards.length ? `<div class="list">${cards.map(x => `<div class="it" data-go="money"><div class="t"><b>${esc(x.name)}</b><div class="sub">${x.dueDate ? (x.billed > 0 ? `本期應繳 ${amt(x.billed, x.currency)}・${mdLabel(x.dueDate)} 截止` : '本期沒有待繳') : '未設定結帳日／繳款日'}</div></div><div class="a num ${x.liab ? 'neg' : 'muted'}">${x.liab ? '未繳 ' + amt(x.liab, x.currency) : '0'}</div></div>`).join('')}</div>` : '<div class="sub">尚未新增信用卡帳戶</div>'}</div>

function budgetLine(r){

/* =========================================================
   頁面：日常記帳（交易紀錄）
   ========================================================= */
function ledgerRows(){
  const rows = [];
  for (const t of Object.values(S.tx)){
    const a = acc(t.accountId), b = acc(t.toAccountId);
    let title = '', sub = [], amount = 0, cls = '';
    if (t.type === 'transfer' || t.type === 'ccpay'){ title = (TX_TYPES[t.type]) + (t.note ? '・' + t.note : ''); sub.push((a ? a.name : '?') + ' → ' + (b ? b.name : '?')); amount = +t.twd || +t.amount; cls = 'muted'; }
    else if (t.type === 'adjust'){ title = '盤點調整' + (t.note ? '・' + t.note : ''); sub.push(a ? a.name : ''); amount = +t.twd || +t.amount; cls = amount < 0 ? 'neg' : 'pos'; }
    else { title = (t.note || catName(t.categoryId)); sub.push(catName(t.categoryId)); if (a) sub.push(a.name); if (t.meal) sub.push(t.meal); if (t.scene && t.scene !== C.settings.dailyScene) sub.push(t.scene); if (t.nw && (t.type === 'expense' || t.type === 'refund')) sub.push(NW[t.nw]); if ((t.tags || []).length) sub.push(tagTxt(t.tags));
      amount = (+t.twd || +t.amount) * (t.type === 'expense' ? -1 : 1); cls = t.type === 'expense' ? '' : 'pos'; if (t.type === 'refund') title = '退款・' + title; }
    if (t.currency && t.currency !== 'TWD') sub.push(amt(t.amount, t.currency));
    rows.push({key:'tx:' + t.id, tag:t.recurringId ? '固定' : t.treatId ? '請客拆帳' : '', nw:t.nw || '', date:t.date, type:t.type, title, sub:sub.join('・'), amount, cls, accs:[t.accountId, t.toAccountId], cat:t.categoryId, tags:t.tags || [], created:t.createdAt || 0});
  }

function quickAccs(sel){
  const score = {}; const since = ymd(new Date(Date.now() - 90 * 86400000));
  for (const t of Object.values(S.tx)) if (t.date >= since && ['expense','income','refund'].includes(t.type) && !t.recurringId) score[t.accountId] = (score[t.accountId] || 0) + 1;
  for (const s of Object.values(S.shared)) if (s.date >= since && s.accountId) score[s.accountId] = (score[s.accountId] || 0) + 1;
  const order = {cash:0, credit:1, epay:2, bank:3};

  const list = C.accounts.filter(a => a.active !== false && !reserved(a)).sort((a, b) => (score[b.id] || 0) - (score[a.id] || 0) || order[a.type] - order[b.type]);
  const out = list.slice(0, 6); const sa = acc(sel); if (sa && !out.includes(sa)) out.push(sa);

}
function quickCats(type, sel){

  const bump = (id, w) => { if (id) score[id] = (score[id] || 0) + w; };
  for (const t of Object.values(S.tx)) if (t.date >= since && ((type === 'income') === (t.type === 'income')) && ['expense','income','refund'].includes(t.type)) bump(t.categoryId, 3);
  if (type === 'expense'){ for (const s of Object.values(S.shared)) if (s.date >= since) bump(s.categoryId, 3); for (const h of Object.values(S.hist)) if (h.month >= hSince){ if ((h.rows || []).length) for (const r of h.rows) bump(r.categoryId, 1); else for (const it of (h.items || [])) bump(it.categoryId, it.count || 1); } }

}

}
const fxId = (sl, ym, part = '') => `fx-${sl.id}-${ym.replace('-', '')}${part}`;

}

function recDue(r, month){ const [y, m] = month.split('-').map(Number); return ymd(dateWithDay(y, m - 1, +r.day || 1)); }
const recTxId = (r, month) => 'rc-' + r.id + '-' + month.replace('-', '');

    const due = recDue(r, month); const tx = S.tx[recTxId(r, month)];

}

const C128 = '212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 2331112'.split(' ');
const C39 = {'0':'000110100','1':'100100001','2':'001100001','3':'101100000','4':'000110001','5':'100110000','6':'001110000','7':'000100101','8':'100100100','9':'001100100','A':'100001001','B':'001001001','C':'101001000','D':'000011001','E':'100011000','F':'001011000','G':'000001101','H':'100001100','I':'001001100','J':'000011100','K':'100000011','L':'001000011','M':'101000010','N':'000010011','O':'100010010','P':'001010010','Q':'000000111','R':'100000110','S':'001000110','T':'000010110','U':'110000001','V':'011000001','W':'111000000','X':'010010001','Y':'110010000','Z':'011010000','-':'010000101','.':'110000100',' ':'011000100','*':'010010100','$':'010101000','/':'010100010','+':'010001010','%':'000101010'};
const EAN_L = ['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const EAN_G = ['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
const EAN_P = ['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function eanOk(v){ if (!/^\d{13}$/.test(v)) return false; const d = v.split('').map(Number); const sum = d.slice(0, 12).reduce((s, x, i) => s + x * (i % 2 ? 3 : 1), 0); return (10 - sum % 10) % 10 === d[12]; }

function barModules(code, fmt){
  // 回傳 [寬度, 是否為黑條] 的陣列
  const out = []; const push = (w, bar) => { if (w > 0) out.push([w, bar]); };
  if (fmt === 'ean13'){
    const d = code.split('').map(Number); let bits = '101';
    const par = EAN_P[d[0]]; for (let i = 1; i <= 6; i++) bits += (par[i - 1] === 'L' ? EAN_L : EAN_G)[d[i]];
    bits += '01010'; for (let i = 7; i <= 12; i++) bits += EAN_L[d[i]].split('').map(b => b === '1' ? '0' : '1').join('');
    bits += '101'; for (const b of bits) push(1, b === '1'); return out;
  }
  if (fmt === 'code39'){
    const txt = '*' + code.toUpperCase() + '*';
    for (const ch of txt){ const pt = C39[ch]; if (!pt) throw new Error('Code39 不支援「' + ch + '」'); pt.split('').forEach((w, i) => push(w === '1' ? 3 : 1, i % 2 === 0)); push(1, false); }

    const st = w.status || 'waiting';

function histCard(){
  const cur = ymOf(today());
  const ms0 = [...Object.keys(S.hist), ...Object.values(S.tx).map(t => ymOf(t.date)), ...Object.values(S.shared).map(x => ymOf(x.date))].filter(Boolean);
  if (!ms0.length) return '';
  const first = ms0.reduce((a, b) => a < b ? a : b, cur);
  const months = []; for (let x = cur, g = 0; x >= first && g < 60; x = addMonth(x, -1), g++) months.push(x);
  return `<div class="card"><h2>每月明細 <span class="sub">點月份看一筆一筆的紀錄，也可以直接修改</span></h2>

function catModal(c = null, type = 'expense'){
  const isNew = !c; c = c ? {...c} : {type, active:true, inBudget:type === 'expense', rollover:type === 'expense', essential:false, isMeal:false};
  const parents = C.categories.filter(x => x.type === c.type && x.id !== c.id && !catDesc(c.id || '_').has(x.id) && !x.parentId);
  const ex = c.type === 'expense';
  const ov = openModal(isNew ? '新增分類' : '編輯分類', `
    <label class="f"><span>分類名稱</span><input class="in" id="c_name" value="${esc(c.name)}" autofocus></label>
    <label class="f"><span>上層分類（選填）</span><select class="in" id="c_parent"><option value="">無（最上層）</option>${parents.map(p => `<option value="${p.id}" ${p.id === c.parentId ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label>
    ${ex ? `<label class="chk"><input type="checkbox" id="c_meal" ${c.isMeal ? 'checked' : ''}>屬於餐飲（計入餐飲分析）</label>
    <label class="chk"><input type="checkbox" id="c_ess" ${c.essential ? 'checked' : ''}>必要支出</label>
    <label class="chk"><input type="checkbox" id="c_bud" ${c.inBudget ? 'checked' : ''}>納入預算</label>
    <label class="chk"><input type="checkbox" id="c_roll" ${c.rollover ? 'checked' : ''}>預算剩餘自動結轉</label>` : ''}
    <label class="chk"><input type="checkbox" id="c_act" ${c.active !== false ? 'checked' : ''}>啟用中</label>`,
    {foot:`${!isNew ? '<button class="btn dng" data-del>刪除</button>' : ''}<span class="sp"></span><button class="btn" data-close>取消</button><button class="btn pri" data-save>儲存</button>`});
  ov.querySelector('[data-save]').onclick = e => busy(e.target, async () => {
    const name = val(ov, '#c_name'); if (!name) return toast('請輸入名稱', 'err');
    const rec = {...c, id:c.id || uid(), name, parentId:val(ov, '#c_parent'), active:checked(ov, '#c_act')};
    if (ex) Object.assign(rec, {isMeal:checked(ov, '#c_meal'), essential:checked(ov, '#c_ess'), inBudget:checked(ov, '#c_bud'), rollover:checked(ov, '#c_roll')});
    const list = C.categories.slice(); const i = list.findIndex(x => x.id === rec.id); if (i >= 0) list[i] = rec; else list.push(rec);
    await saveItems('categories', list); closeModal(ov); toast('分類已儲存');
  });
  const d = ov.querySelector('[data-del]');
  if (d) d.onclick = async () => {
    const used = Object.values(S.tx).some(t => t.categoryId === c.id) || Object.values(S.shared).some(s => s.categoryId === c.id) || C.categories.some(x => x.parentId === c.id) || C.budgets.some(b => b.categoryId === c.id);
    if (used) return toast('此分類已被使用（或有子分類、預算），無法刪除，請改為停用', 'err');
    if (await confirmBox(`確定刪除分類「${esc(c.name)}」？`, '刪除')) { await saveItems('categories', C.categories.filter(x => x.id !== c.id)); closeModal(ov); }
  };
}

/* 匯出／匯入 */
async function offerFile(filename, text, mime){
  if (DL){
    try { await DL.save({filename, data:text, mimeType:mime}); toast('已提供下載'); return; } catch(e){ if (e && /declin|cancel|abort/i.test(e.code || e.message || '')) return; }
  }
  if (!window.claude){ try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type:mime})); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); return; } catch(e){} }
  const ov = openModal(GAS ? '下載檔案' : '複製資料', `<div class="sub" style="margin-bottom:8px">${GAS ? `檔案「${esc(filename)}」應該已經開始下載。如果沒有反應（有些手機會擋），請按「複製全部」，貼到記事本後另存成這個檔名。` : `無法直接下載，請複製以下內容並另存為「${esc(filename)}」。`}</div><textarea class="in" style="min-height:260px;font-family:monospace;font-size:12px" readonly>${esc(text)}</textarea>`,
    {wide:true, foot:'<span class="sp"></span><button class="btn pri" data-copy>複製全部</button>'});
  ov.querySelector('[data-copy]').onclick = async () => { try { await navigator.clipboard.writeText(text); toast('已複製'); } catch(e){ ov.querySelector('textarea').select(); toast('請手動選取並複製', 'err'); } };
}
function exportCsv(){
  const head = ['日期','類型','內容／備註','分類','餐別','情境','帳戶','轉入帳戶','原幣金額','幣別','匯率','台幣金額','個人負擔（台幣）','需要／想要','共同對象','對方應付','編號','標籤'];
  const rows = [];
  for (const t of Object.values(S.tx)) rows.push([t.date, TX_TYPES[t.type], t.note, t.categoryId ? catName(t.categoryId) : '', t.meal, t.scene, acc(t.accountId)?.name, acc(t.toAccountId)?.name || '', t.amount, t.currency, t.rate, t.twd, t.type === 'expense' ? t.twd : t.type === 'refund' ? -t.twd : '', NW[t.nw] || '', '', '', t.id, (t.tags || []).join(' ')]);
  for (const s of Object.values(S.shared)) rows.push([s.date, s.payer === 'other' ? '代購（對方先付）' : '共同消費', s.desc, catName(s.categoryId), s.meal, s.scene, acc(s.accountId)?.name, '', s.total, s.currency || 'TWD', s.rate || 1, r2(s.total * (s.rate || 1)), r2(s.myShare * (s.rate || 1)), NW[s.nw] || '', person(s.personId)?.name, s.otherShare, s.id, (s.tags || []).join(' ')]);
  for (const st of Object.values(S.settle)) rows.push([st.date, st.direction === 'out' ? '還款給對方' : '收回代墊款', st.note, '', '', '', acc(st.accountId)?.name, '', (st.direction === 'out' ? -1 : 1) * st.amount, st.currency || 'TWD', st.rate || 1, r2((st.direction === 'out' ? -1 : 1) * st.amount * (st.rate || 1)), '', '', person(st.personId)?.name, '', st.id]);
  for (const h of Object.values(S.hist)) for (const r of (h.rows || [])) rows.push([r.date, '過往紀錄', r.note || '', catName(r.categoryId), mealFor(r.categoryId), '', '', '', r.amount, 'TWD', 1, r.amount, r.amount, '', '', '', h.id, (r.tags || []).join(' ')]);
  for (const h of Object.values(S.hist)) if (!(h.rows || []).length) for (const it of (h.items || [])) rows.push([h.month, '歷史彙總', it.name + (it.count ? `（${it.count} 次）` : ''), catName(it.categoryId), it.meal || '', '', '', '', it.amount, 'TWD', 1, it.amount, it.amount, '', '', '', h.id]);
  rows.sort((a, b) => a[0] < b[0] ? -1 : 1);
  const q = v => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const csv = '﻿' + [head, ...rows].map(r => r.map(q).join(',')).join('\r\n');
  offerFile('收支明細_' + today() + '.csv', csv, 'text/csv');
}

async function importJson(file){
  let d; try { d = JSON.parse(await file.text()); } catch(e){ return toast('檔案格式錯誤', 'err'); }
  const data = d && d.data; if (!data || !data.config) return toast('這不是本記帳本的備份檔', 'err');
  if (!await confirmBox('匯入會以備份檔內容<b>取代</b>目前所有資料，確定繼續？建議先匯出目前資料備份。', '取代並匯入')) return;
  const ov = openModal('匯入中', '<div class="empty" id="impProg">準備中…</div>');
  if (GAS){
    try {
      if (RO) { closeModal(ov); return toast('檢視模式不能匯入', 'err'); }
      const ops = [];
      for (const c of COLS){
        for (const id of Object.keys(S[c])) if (!(data[c] || {})[id]) ops.push({op:'del', col:c, id});
        for (const [id, v] of Object.entries(data[c] || {})) ops.push({op:'put', col:c, id, json:JSON.stringify({...v, id})});
      }
      let chunk = [], size = 0, done = 0;
      const send = async () => { if (!chunk.length) return; await gas('saveBatch', chunk); done += chunk.length; ov.querySelector('#impProg').textContent = `已處理 ${done}／${ops.length}`; chunk = []; size = 0; };
      for (const o of ops){ chunk.push(o); size += (o.json || '').length; if (size > 300000) await send(); }
      await send(); await gLoad();
      closeModal(ov); toast(`匯入完成，共 ${ops.length} 筆資料`);
    } catch(e){ closeModal(ov); toast('匯入中斷：' + (e && e.message || e), 'err'); }
    return;
  }
  try {
    let n = 0; const total = COLS.reduce((s, c) => s + Object.keys(S[c]).length + Object.keys(data[c] || {}).length, 0);
    for (const c of COLS){
      for (const id of Object.keys(S[c])) if (!(data[c] || {})[id]){ await del(c, id); n++; }
      for (const [id, v] of Object.entries(data[c] || {})){ await put(c, id, v); n++; if (n % 10 === 0) ov.querySelector('#impProg').textContent = `已處理 ${n}／${total}`; }
    }
    closeModal(ov); toast('匯入完成');
  } catch(e){ closeModal(ov); toast('匯入中斷：' + errMsg(e), 'err'); }
}

document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]'); if (go && !e.target.closest('[data-act]')){ location.hash = '#' + go.dataset.go; return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'A') e.preventDefault();
  if (el.closest('.it') && el.tagName === 'BUTTON' && el !== el.closest('.it')) e.stopPropagation();
  const fn = ACTIONS[el.dataset.act]; if (fn) fn(el);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && MODAL_STACK.length) closeModal();
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter){ e.preventDefault(); const fn = ACTIONS[e.target.dataset.enter]; if (fn) fn(e.target); }
});
let qTimer;
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.change; if (k === 'q'){ clearTimeout(qTimer); qTimer = setTimeout(() => { UI.q = e.target.value; render(); }, 250); } });
document.addEventListener('change', e => {
  const t = e.target; const k = t.dataset && t.dataset.change;
  if (t.id === 'importFile' && t.files[0]){ importJson(t.files[0]); t.value = ''; return; }
  if (t.dataset.slotName !== undefined){ const list = C.settings.mealSlots.map(x => ({...x})); const n = t.value.trim(); if (!n) return render(); list[+t.dataset.slotName].name = n; busy(null, () => saveSettings({mealSlots:list})); return; }
  if (t.dataset.fxI !== undefined){ const list = fixedSlotsList().map(x => ({...x})); const f = t.dataset.fxF; const v = f === 'base' ? Number(t.value) || 0 : t.value; if (f === 'name' && !String(v).trim()) return render(); list[+t.dataset.fxI][f] = f === 'name' ? v.trim() : v; busy(null, () => saveSettings({fixedSlots:list})); return; }
  if (t.dataset.slotTarget !== undefined){ const list = C.settings.mealSlots.map(x => ({...x})); const it = list[+t.dataset.slotTarget]; it.target = t.value === '' ? null : Math.max(0, Number(t.value) || 0); if (!it.tper) it.tper = (MT_DEF[it.name] || [])[1] || 'day'; if (it.target === null) delete it.target; busy(null, () => saveSettings({mealSlots:list})); return; }
  if (t.dataset.slotTper !== undefined){ const list = C.settings.mealSlots.map(x => ({...x})); const it = list[+t.dataset.slotTper]; it.tper = t.value; if (it.target === undefined && MT_DEF[it.name]) it.target = MT_DEF[it.name][0]; busy(null, () => saveSettings({mealSlots:list})); return; }
  if (t.dataset.slotCat !== undefined){ const list = C.settings.mealSlots.map(x => ({...x})); list[+t.dataset.slotCat].categoryId = t.value; busy(null, () => saveSettings({mealSlots:list})); return; }
  if (t.dataset.rate !== undefined){ const list = C.settings.currencies.map(x => ({...x})); const r = Number(t.value); if (!r || r <= 0) return toast('匯率需大於 0', 'err'); list[+t.dataset.rate].rate = r; busy(null, () => saveSettings({currencies:list})); return; }
  if (!k || k === 'q') return;
  if (['fType','fAcc','fCat','fNw','fTag'].includes(k)){ UI[k] = t.value; render(); }
  else if (k === 'anTag'){ UI.anTag = t.value; render(); }
  else if (k === 'anCat'){ UI.anCat = t.value; render(); }
  else if (k === 'mealDate'){ if (t.value){ UI.mealDate = t.value; render(); } }
  else if (k === 'showInactive'){ UI.showInactive = t.checked; render(); }
  else if (k === 'dailyScene') busy(null, () => saveSettings({dailyScene:t.value}));
  else if (k === 'remindDays'){ const v = Math.max(1, Math.round(Number(t.value) || 7)); busy(null, () => saveSettings({remindDays:v})); }
  else if (k === 'carryNegative') busy(null, () => saveSettings({carryNegative:t.checked}));
});
